name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          PLUGIN_ID=$(jq -r .id plugin.json)
          VERSION=$(jq -r .version plugin.json)
          mkdir -p staging/lib
          cp plugin.json staging/
          cp target/${{ matrix.target }}/release/*.dylib staging/lib/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/*.so staging/lib/ 2>/dev/null || true
          cd staging
          tar czf ../${PLUGIN_ID}-${VERSION}-${{ matrix.platform }}.tar.gz .

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $id = (Get-Content plugin.json | ConvertFrom-Json).id
          $version = (Get-Content plugin.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path staging/lib | Out-Null
          Copy-Item plugin.json staging/
          Copy-Item target/${{ matrix.target }}/release/*.dll staging/lib/
          Push-Location staging
          tar czf ../$id-$version-${{ matrix.platform }}.tar.gz .
          Pop-Location

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
