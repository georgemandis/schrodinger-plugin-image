[package]
name = "schrodinger-plugin-image"
version = "0.1.0"
edition = "2021"
description = "Image conversion, metadata removal and resizing plugin for Schrödinger"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
schrodinger-plugin-sdk = { git = "https://github.com/georgemandis/schrodinger-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "gif", "bmp", "webp"] }

[dev-dependencies]
png = "0.17"
tempfile = "3"
